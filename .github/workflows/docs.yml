name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEFAULT_NODE_VERSION: '24.x'

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # lastUpdated timestamps come from git history.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.DEFAULT_NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # docs:build runs docs:gen first, so the generated reference/ pages are
    # always regenerated from the current source rather than reused.
    - name: Build site
      run: npm run docs:build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only publish from main; pull requests build to verify, but do not deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
