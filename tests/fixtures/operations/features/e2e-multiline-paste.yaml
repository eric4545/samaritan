name: E2E Multi-line Paste
version: 1.0.0
description: >-
  Fixture for the [p] multi-line confirm e2e test. Both steps carry a
  backslash-continuation command, so each [p] would trigger the bracketed-paste
  confirm — until the operator answers [a] (don't ask again for this pane).

environments:
  - name: staging
    description: Staging environment
    variables: {}

steps:
  - name: First block
    type: automatic
    command: |
      echo FIRST \
        MULTILINE_ONE
  - name: Second block
    type: automatic
    command: |
      echo SECOND \
        MULTILINE_TWO
