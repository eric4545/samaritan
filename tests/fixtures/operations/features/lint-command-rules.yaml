# Every built-in command rule fires once on this file (`samaritan lint`).
# `validate` reports the same findings as warnings and still passes.
name: lint-command-rules
version: 1.0.0
description: One step per lint command rule
environments:
  - name: staging
    description: Staging
    variables:
      CLUSTER: web-staging
steps:
  - name: Strict mode
    type: automatic
    command: set -euo pipefail
  - name: Push release
    type: automatic
    command: git push origin HEAD:main
  - name: Describe stack
    type: automatic
    command: aws cloudformation describe-stacks --stack-name web-server
  - name: Switch cluster
    type: automatic
    command: kubectl config use-context "${CLUSTER:?not set}"
  - name: Clean up
    type: automatic
    command: |
      tmux killp -t ops
      exit 0
  - name: Write file
    type: automatic
    command: |
      cat <<EOF > /tmp/web-server.conf
      listen 8080
      EOF
