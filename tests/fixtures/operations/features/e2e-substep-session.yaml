name: E2E Sub-step Session
version: 1.0.0
description: >-
  Fixture for the real-tmux e2e of sub-step session inheritance. Two local
  sessions are spawned; the parent step declares the second one, and its
  sub-step (no session of its own) must be pasted into that pane, not into the
  first (active) one.

sessions:
  first: {}
  app: {}

environments:
  - name: staging
    description: Staging environment
    variables:
      TAG: v1

steps:
  - name: App checks
    type: manual
    session: app
    sub_steps:
      - name: Echo in app pane
        type: automatic
        command: echo "substep ${TAG} E2E_SUBSTEP_OK"
        expect:
          contains: E2E_SUBSTEP_OK
