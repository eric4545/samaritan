# Example: Operation using environment references
name: Deploy Web Application
version: 1.0.0
description: Deploy web application using reusable environments
author: sre-team@example.com
category: deployment

# Use simplified environment syntax with manifest inheritance
environments:
  - name: staging
    from: k8s-cluster
    variables:
      IMAGE_TAG: staging-latest
      PREVIOUS_REPLICAS: 1
      DEBUG_ENABLED: true

  - name: production
    from: k8s-cluster
    variables:
      IMAGE_TAG: v${VERSION}
      PREVIOUS_REPLICAS: 3
      DEBUG_ENABLED: false

variables:
  REGISTRY: registry.example.com/web

steps:
  - name: Check Image Exists
    type: automatic
    phase: preflight
    command: docker manifest inspect ${REGISTRY}/${IMAGE_TAG}
    description: Verify container image exists

  - name: Deploy Application
    type: automatic
    phase: flight
    command: kubectl apply -f k8s/ --namespace ${NAMESPACE}
    timeout: 300
    evidence:
      required: true
      types: [command_output]
    rollback:
      - command: kubectl rollout undo deployment/webapp --namespace ${NAMESPACE}

  - name: Scale Deployment
    type: automatic
    phase: flight
    command: kubectl scale deployment webapp --replicas=${REPLICAS} --namespace ${NAMESPACE}
    timeout: 120
    rollback:
      - command: kubectl scale deployment webapp --replicas=${PREVIOUS_REPLICAS} --namespace ${NAMESPACE}

  - name: Verify Health
    type: manual
    phase: postflight
    instruction: |
      Check application health:
      1. Visit: https://${DOMAIN}/health
      2. Verify all ${REPLICAS} pods are running
      3. Test key functionality
    evidence:
      required: true
      types: [screenshot]