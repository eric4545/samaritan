name: Evidence Required Gate
version: 1.0.0
description: |
  Demonstrates the evidence-required gate in `samaritan run`: a step marked
  `evidence: { required: true }` cannot be completed (or approved) with plain
  Enter until evidence has actually been captured.

  Run interactively:
    samaritan run evidence-required-step.yaml --env production

  At either step below, pressing ↵ (or "a" approve) with no evidence
  captured yet shows an inline warning ON THE SAME action bar (no separate
  gate menu, no re-entry), and the bar labels it `e evidence!`:
    ⚠️  This step requires evidence — press e to capture (typed text is fine) or s to skip.

  From that same bar:
    e  capture evidence — a single-key sub-bar:
         ↵ pane output · i clipboard image · f file · t text/link
       e.g. copy a screenshot of the dashboard then `e` `i`, or `e` `t` and
       paste the Jenkins build URL (stored as a clickable link, credentials
       stripped). Once at least one item is captured the step completes on
       your next ↵
    s  skip — skip the step; recorded as skipped (not completed) in the
       run record

  This enforcement is ON by default whenever evidence.required is true. To
  disable it (e.g. for a CI dry-run rehearsal), pass:
    samaritan run evidence-required-step.yaml --env production --no-require-evidence

  Note: the gate only applies to `manual`/sidecar step completion and to
  `approval` steps' approve (`a`) path — it does not gate plain (non-sidecar)
  `type: automatic` steps.

environments:
  - name: production

steps:
  - name: Confirm rollout health
    type: manual
    instruction: |
      Check the deployment dashboard and confirm all pods are healthy before
      continuing. Capture the dashboard screenshot (`e` `i` after copying it),
      the Jenkins/Argo build link (`e` `t`), or `kubectl get pods` output
      (`e` `↵`) as evidence.
    evidence:
      required: true
      types: [screenshot, link, command_output]

  - name: Sign off on rollout
    type: approval
    instruction: |
      Sign off that the rollout is safe to leave running unattended. Capture
      a final health-check output as evidence before approving.
    evidence:
      required: true
      types: [command_output]
